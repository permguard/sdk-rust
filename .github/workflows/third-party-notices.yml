# A dependency change that never reaches THIRD_PARTY_NOTICES.md is a distribution whose notices are
# wrong. That is why this fails the build rather than warning, and why it runs on every push and
# pull request rather than only on a release.

name: third-party notices

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  notices:
    name: notices match the dependency graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: The notices match what the build links
        run: ./scripts/third-party-notices.sh --check
